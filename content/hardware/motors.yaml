# H1 Motors and actuators: a row of cards on the Hardware page. The types are
# in the same order and have the same keys as the rows of compare table X1
# (content/compare/actuators.yaml), folded into every type's page. Each type
# has a page per language, content/hardware/<lang>/motors/<key>.md, and a
# drawing, content/figures/hw-<key>.svg; the category's own page,
# content/hardware/<lang>/motors.md, holds its title, summary and the
# "Which one?" advice shown with the comparison.
