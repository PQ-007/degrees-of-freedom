<!-- C2: four ways to pass a motor's turning on. Top left, spur gears: a
     small gear turns a big one the other way, slower. Top right, a
     planetary set: a sun gear in the middle, three planets around it, an
     internal ring outside; the carrier joining the planets (accent) is the
     output. Bottom left, a belt over two pulleys (accent). Bottom right, a
     lead screw: turning the screw drives the nut along it (accent arrow).
     Wordless; generated with gear outlines like the C2 demo's. -->
