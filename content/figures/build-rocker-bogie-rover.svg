<!-- Robots page, Builds row: B08, a small hobby rover on a rocker-bogie,
     side view. A box body with a controller board and a camera on a mast;
     on the side, the rocker (body pivot to the front wheel and the bogie
     pivot) and the bogie (to the middle and rear wheels), in the accent
     colour. The wheels (each a "spin" group) turn on hover (look.css). No
     words, so it suits every language. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <line x1="10" y1="145" x2="230" y2="145" class="thin"/>
  <rect x="62" y="44" width="116" height="38" rx="3" class="soft thick"/>
  <rect x="80" y="36" width="40" height="8" class="soft thin"/>
  <line x1="156" y1="44" x2="156" y2="20" class="thick"/>
  <rect x="148" y="10" width="20" height="12" rx="2" class="soft thick"/>
  <circle cx="162" cy="16" r="3" class="thin"/>
  <path d="M190,127 L132,86 L76,103" class="accent-stroke"/>
  <path d="M40,127 L76,103 L108,127" class="accent-stroke"/>
  <circle cx="132" cy="86" r="4" class="soft thick"/>
  <circle cx="76" cy="103" r="4" class="soft thick"/>
  <g class="spin" style="transform-origin: 40px 127px">
    <circle cx="40" cy="127" r="17" class="soft thick"/>
    <line x1="23" y1="127" x2="57" y2="127" class="thin"/>
    <line x1="40" y1="110" x2="40" y2="144" class="thin"/>
    <circle cx="40" cy="127" r="4" class="soft thick"/>
  </g>
  <g class="spin" style="transform-origin: 108px 127px">
    <circle cx="108" cy="127" r="17" class="soft thick"/>
    <line x1="91" y1="127" x2="125" y2="127" class="thin"/>
    <line x1="108" y1="110" x2="108" y2="144" class="thin"/>
    <circle cx="108" cy="127" r="4" class="soft thick"/>
  </g>
  <g class="spin" style="transform-origin: 190px 127px">
    <circle cx="190" cy="127" r="17" class="soft thick"/>
    <line x1="173" y1="127" x2="207" y2="127" class="thin"/>
    <line x1="190" y1="110" x2="190" y2="144" class="thin"/>
    <circle cx="190" cy="127" r="4" class="soft thick"/>
  </g>
</svg>
