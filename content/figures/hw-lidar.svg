<!-- Hardware: lidar. A line drawing with no words, so it suits every language; the part the entry is about is in the accent colour. The group with a motion class moves on hover (look.css). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <rect x="70" y="96" width="100" height="40" rx="5" class="soft thick"/>
  <g class="spin slow" style="transform-origin: 120px 78px">
    <path d="M138,78 L228,78" class="under"/><path d="M138,78 L228,78" class="accent-stroke"/>
    <circle cx="120" cy="78" r="34" class="soft thick"/>
    <rect x="140" y="70" width="12" height="16" rx="2" class="accent-fill thick"/>
    <line x1="96" y1="78" x2="112" y2="78" class="thin"/>
  </g>
  <circle cx="120" cy="78" r="6" class="soft thin"/>
</svg>
