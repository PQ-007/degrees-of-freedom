  <rect x="14" y="52" width="62" height="56" rx="6" class="soft thick"/>
  <line x1="76" y1="80" x2="96" y2="80" class="thick"/>
  <line x1="96" y1="62" x2="96" y2="98" class="thick"/>
  <g class="squash" style="transform-origin: 96px 80px">
    <path d="M96.0,80.0 L101.3,94.0 L106.6,66.0 L111.9,94.0 L117.1,66.0 L122.4,94.0 L127.7,66.0 L133.0,94.0 L138.3,66.0 L143.6,94.0 L148.9,66.0 L154.1,94.0 L159.4,66.0 L164.7,94.0 L170.0,80.0" class="under"/><path d="M96.0,80.0 L101.3,94.0 L106.6,66.0 L111.9,94.0 L117.1,66.0 L122.4,94.0 L127.7,66.0 L133.0,94.0 L138.3,66.0 L143.6,94.0 L148.9,66.0 L154.1,94.0 L159.4,66.0 L164.7,94.0 L170.0,80.0" class="accent-stroke"/>
  </g>
