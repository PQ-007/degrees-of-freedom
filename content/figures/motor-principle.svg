<!-- F6: how a motor turns, seen along the motor's axis. Between the N and
     S poles the field B runs left to right. A loop of wire, seen edge-on,
     carries current out of the page on its left wire (dot) and into the page
     on its right wire (cross). The field pushes the left wire up and the
     right wire down (F), turning the loop clockwise about its axis. Maths-only
     labels; the caption is in the page's text. -->
