<!-- F1: the unit circle. An angle θ, the radius 1, the arc it cuts off (of
     length θ when the angle is in radians), and cos θ, sin θ as the point's
     x and y. Labels are maths only, so the figure works in every language;
     the caption is in the page's text. Lines take their colour from CSS. -->
<svg xmlns="http://www.w3.org/2000/svg" width="340" viewBox="0 0 320 290" class="fig-unit-circle">
  <defs>
    <marker id="uc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ink-fill"/>
    </marker>
  </defs>
  <line x1="24" y1="160" x2="296" y2="160" class="thin" marker-end="url(#uc-arrow)"/>
  <line x1="150" y1="276" x2="150" y2="24" class="thin" marker-end="url(#uc-arrow)"/>
  <circle cx="150" cy="160" r="110" class="thin"/>
  <path d="M260,160 A110,110 0 0 0 234.3,89.3" class="accent thick"/>
  <path d="M180,160 A30,30 0 0 0 173,140.7" class="accent"/>
  <line x1="150" y1="160" x2="234.3" y2="89.3" class="thick"/>
  <line x1="234.3" y1="89.3" x2="234.3" y2="160" class="dash"/>
  <line x1="150" y1="166" x2="234.3" y2="166" class="dash"/>
  <circle cx="234.3" cy="89.3" r="5" class="accent-fill"/>
  <text x="300" y="165">x</text>
  <text x="156" y="22">y</text>
  <text x="186" y="152">θ</text>
  <text x="180" y="116">1</text>
  <text x="174" y="184">cos θ</text>
  <text x="229" y="132" text-anchor="end">sin θ</text>
  <text x="264" y="120">θ</text>
</svg>
