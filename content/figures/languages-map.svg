<!-- F8: where each language runs, from the top down. A laptop (Python,
     MATLAB) talks over the network (dashed) to the robot's computer (Linux;
     C++ and Python; ROS 2), which is wired to a microcontroller (C, C++)
     that drives the motor. Drawn tall, not wide, so the names stay readable
     on a phone. Only language names as labels; the caption is in the page's
     text. -->
<svg xmlns="http://www.w3.org/2000/svg" width="340" viewBox="0 0 340 460" class="fig-languages">
  <!-- the laptop -->
  <rect x="32" y="20" width="106" height="70" class="thick"/>
  <rect x="42" y="30" width="86" height="50" class="thin"/>
  <path d="M18,98 L152,98 L144,112 L26,112 Z" class="thick"/>
  <line x1="66" y1="105" x2="104" y2="105" class="thin"/>
  <text x="178" y="56" style="font-style:normal">Python</text>
  <text x="178" y="82" style="font-style:normal">MATLAB</text>

  <!-- over the network -->
  <line x1="85" y1="118" x2="85" y2="160" class="dash"/>

  <!-- the robot's computer: a board, its processor, a pin header, ports -->
  <rect x="20" y="166" width="130" height="90" class="thick"/>
  <rect x="58" y="190" width="44" height="44" class="soft thick"/>
  <g class="thin">
    <circle cx="34" cy="177" r="2.5"/><circle cx="44" cy="177" r="2.5"/>
    <circle cx="54" cy="177" r="2.5"/><circle cx="64" cy="177" r="2.5"/>
    <circle cx="74" cy="177" r="2.5"/><circle cx="84" cy="177" r="2.5"/>
    <circle cx="94" cy="177" r="2.5"/><circle cx="104" cy="177" r="2.5"/>
    <circle cx="114" cy="177" r="2.5"/><circle cx="124" cy="177" r="2.5"/>
  </g>
  <rect x="134" y="196" width="22" height="16" class="thin"/>
  <rect x="134" y="220" width="22" height="16" class="thin"/>
  <text x="178" y="192" style="font-style:normal">Linux</text>
  <text x="178" y="218" style="font-style:normal">C++ · Python</text>
  <text x="178" y="244" style="font-style:normal">ROS 2</text>

  <!-- a wire -->
  <line x1="85" y1="256" x2="85" y2="306" class="thick"/>

  <!-- the microcontroller: a chip with legs -->
  <rect x="55" y="310" width="60" height="60" class="soft thick"/>
  <g class="thin">
    <line x1="43" y1="322" x2="55" y2="322"/><line x1="43" y1="334" x2="55" y2="334"/>
    <line x1="43" y1="346" x2="55" y2="346"/><line x1="43" y1="358" x2="55" y2="358"/>
    <line x1="115" y1="322" x2="127" y2="322"/><line x1="115" y1="334" x2="127" y2="334"/>
    <line x1="115" y1="346" x2="127" y2="346"/><line x1="115" y1="358" x2="127" y2="358"/>
  </g>
  <circle cx="65" cy="320" r="3" class="ink-fill"/>
  <text x="178" y="345" style="font-style:normal">C · C++</text>

  <!-- to the motor -->
  <line x1="85" y1="370" x2="85" y2="404" class="thin"/>
  <circle cx="85" cy="426" r="20" class="accent"/>
  <circle cx="85" cy="426" r="5" class="ink-fill"/>
  <line x1="105" y1="426" x2="130" y2="426" class="thick"/>
</svg>
