- id: cpp-overflow
  claim: >-
    Unsigned integer arithmetic in C++ is performed modulo 2^n, where n is
    the number of bits in the integer: adding one to the largest value gives
    0. When signed integer arithmetic overflows, the behaviour is undefined;
    it may wrap around, trap, saturate or be optimised away.
  sources:
    - title: "Arithmetic operators: overflows (cppreference)"
      url: https://en.cppreference.com/w/cpp/language/operator_arithmetic.html
  checked: web, 2026-11-15

- id: python-float
  claim: >-
    Most decimal fractions cannot be represented exactly as binary fractions:
    0.1 is stored as a close approximation, so 0.1 + 0.1 + 0.1 == 0.3 is
    False.
  sources:
    - title: "Floating-point arithmetic: issues and limitations (Python tutorial)"
      url: https://docs.python.org/3/tutorial/floatingpoint.html
  checked: web, 2026-11-15

- id: cortex-m3-pipeline
  claim: >-
    The Arm Cortex-M3 processor has a three-stage pipeline: the Fetch stage,
    the Decode stage and the Execute stage.
  sources:
    - title: "Cortex-M3 technical reference manual, revision r1p1 (Arm, ARM DDI 0337E), §1.4 Execution pipeline stages"
      url: https://documentation-service.arm.com/static/6036810d5319e554d4ba108e
  checked: web (the PDF), 2026-11-15

- id: arduino-memory
  claim: >-
    Volatile memory keeps its data only while the system runs and loses it
    when turned off; non-volatile memory keeps it. In a microcontroller, RAM
    is volatile and holds temporary data such as the firmware's variables;
    the compiled firmware is stored in flash, which is non-volatile, and runs
    from there when the board is powered on. Reading from RAM is faster than
    from flash.
  sources:
    - title: "Arduino memory guide (Arduino documentation)"
      url: https://docs.arduino.cc/learn/programming/memory-guide/
  checked: web (the page's source text on GitHub), 2026-11-15

- id: arduino-analogread
  claim: >-
    Arduino boards contain a multichannel 10-bit analog-to-digital converter
    that maps input voltages between 0 and the operating voltage (5 V or
    3.3 V) to integers from 0 to 1023; on an UNO that is 5 V / 1024 units. On
    ATmega boards such as the UNO a reading takes about 100 microseconds.
  sources:
    - title: "analogRead() (Arduino language reference)"
      url: https://docs.arduino.cc/language-reference/en/functions/analog-io/analogRead/
  checked: web (the reference's source text on GitHub), 2026-11-15

- id: arduino-interrupts
  claim: >-
    Interrupts suit tasks such as reading a rotary encoder or monitoring user
    input. The interrupt service routine should be as short and fast as
    possible; inside it delay() won't work and millis() won't increment, and
    variables it changes should be declared volatile.
  sources:
    - title: "attachInterrupt() (Arduino language reference)"
      url: https://docs.arduino.cc/language-reference/en/functions/external-interrupts/attachInterrupt/
  checked: web (the reference's source text on GitHub), 2026-11-15

- id: freertos-scheduler
  claim: >-
    In an application built on a real-time operating system, only one task
    runs at any moment and the scheduler decides when each task runs, saving
    a task's context when it is swapped out and restoring it later. To give
    deterministic real-time behaviour, FreeRTOS gives tasks strict priorities
    and always runs the highest-priority task that is ready. The FreeRTOS
    kernel is a real-time operating system suited to embedded
    microcontroller applications.
  sources:
    - title: "The FreeRTOS kernel scheduler (FreeRTOS user guide, AWS)"
      url: https://docs.aws.amazon.com/freertos/latest/userguide/freertos-kernel-scheduler.html
    - title: "FreeRTOS kernel fundamentals (FreeRTOS user guide, AWS)"
      url: https://docs.aws.amazon.com/freertos/latest/userguide/dev-guide-freertos-kernel.html
  checked: web, 2026-11-15

- id: mr-joints
  claim: >-
    Every joint connects exactly two links. A revolute joint (R, a hinge)
    allows rotation about its axis; a prismatic joint (P, a slider) allows
    translation along it; both have one degree of freedom. A universal joint
    (U), two revolute joints with orthogonal axes, has two; a spherical joint
    (S, a ball and socket, much like a shoulder) has three.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, section 2.2.1 and table 2.1 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: mr-rigid-body-dof
  claim: >-
    A rigid body moving in three-dimensional space has six degrees of
    freedom; a rigid body moving in a plane has three.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, section 2.1 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: mr-grubler
  claim: >-
    Grübler's formula gives the degrees of freedom of a mechanism of N links
    (counting the ground as a link) and J joints, where joint i provides f_i
    freedoms and m is a rigid body's degrees of freedom (3 in a plane, 6 in
    space) — dof = m(N − 1 − J) + Σ f_i.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, section 2.2.2 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: mr-workspace
  claim: >-
    A robot's workspace is a specification of the configurations its
    end-effector can reach; it is driven by the robot's structure,
    independently of the task.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, section 2.5 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: cantilever-deflection
  claim: >-
    A cantilever (a beam fixed at one end) with a load P at its free end
    deflects most at that end, by PL³/(3EI), where L is its length, E the
    material's elastic modulus and I the second moment of area of its cross
    section.
  sources:
    - title: "Deflections due to bending, chapter 10 of the 1.050 Solid Mechanics notes (MIT OpenCourseWare, fall 2004)"
      url: https://ocw.mit.edu/courses/1-050-solid-mechanics-fall-2004/f9a4d5764b9b0f51ffaacbdf69f7aed8_emech10_04.pdf
  checked: web (the PDF), 2026-11-15

- id: metal-properties
  claim: >-
    Densities and elastic moduli — structural steel (A992) 7,850 kg/m³ and
    200 GPa; aluminium 6061-T6 2,710 kg/m³ and 68.9 GPa; titanium alloy
    4,430 kg/m³ and 120 GPa.
  sources:
    - title: "Strength of Materials, appendix C: material properties (J. K. Lord, A. Richardson, S. Davison and D. A. Dillard, LibreTexts)"
      url: https://eng.libretexts.org/Bookshelves/Mechanical_Engineering/Strength_of_Materials/16%3A_Appendices/16.03%3A_Material_Properties
  checked: web, 2026-11-15

- id: pla-datasheet
  claim: >-
    A common 3D-printing PLA, printed solid, has a density of 1.24 g/cm³ and
    a Young's modulus of 2,680 MPa along its layers (X-Y) but 2,160 MPa
    across them (Z); its tensile strength is 39 MPa along the layers and
    35 MPa across them.
  sources:
    - title: "Bambu PLA Basic technical data sheet (Bambu Lab)"
      url: https://cdn.shopify.com/s/files/1/0380/5149/files/Bambu_PLA_Basic_Technical_Data_Sheet.pdf
  checked: web (the PDF), 2026-11-15

- id: prusa-orientation
  claim: >-
    FFF (filament) prints are stronger in one direction than another, so
    structural parts should be printed in the orientation that gives them
    the most strength.
  sources:
    - title: "Modeling with 3D printing in mind (Prusa knowledge base)"
      url: https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135
  checked: web, 2026-11-15

- id: mr-gearing
  claim: >-
    Robot joints want low speeds and large torques, while most motors give
    low torques at up to thousands of rpm, so a transmission reduces speed
    and amplifies torque: gears, cable drives, belts and pulleys, chains and
    sprockets. It should have little slippage and backlash, the rotation
    available at the output with no motion at the input. A gearhead of ratio
    G divides the speed by G and, ideally, multiplies the torque by G; with
    losses the torque is ηG times, η ≤ 1 the efficiency. Since many DC motors
    run at 10,000 rpm or more with no load, robot joints often have gear
    ratios of 100 or more.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, chapter 1 and section 8.9.1 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: mr-apparent-inertia
  claim: >-
    Through a gearhead of ratio G the rotor spins G times faster than the
    joint, so its inertia felt at the joint is G² times its own (the apparent
    or reflected inertia), and can be as large as the rest of the link's or
    larger.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, section 8.9.2 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: mr-gear-tradeoffs
  claim: >-
    Robots with a motor at each axis and no gearheads (direct drive) have low
    friction but see limited use, because the motors must be large and heavy.
    A gearhead lets a smaller motor give the torque, but adds backlash, which
    makes motion control near zero speed hard, and friction, which reduces
    the torque available and makes it uncertain. Friction in a gearhead often
    grows with the gear ratio. Harmonic drive gearing nearly removes backlash
    by being somewhat flexible.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, sections 8.9.3–8.9.5 and 11.8 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: mr-cable-drive
  claim: >-
    Some joints of Barrett's WAM arm are driven by motors at the robot's base
    through cables wound round drums, which reduces the moving mass and so
    the torque the motors need; the UR5 instead has its motor and harmonic
    drive at each joint.
  sources:
    - title: "Modern Robotics: Mechanics, Planning, and Control, example 4.7 (K. M. Lynch and F. C. Park, Cambridge University Press, 2017; free preprint from the authors)"
      url: https://hades.mech.northwestern.edu/index.php/Modern_Robotics
  checked: web (the preprint PDF), 2026-11-15

- id: khk-gear-ratio
  claim: >-
    The speed ratio of a gear pair is the number of teeth of the driven gear
    over that of the driving gear; two external gears in mesh turn opposite
    ways; the ratios of a two-stage train multiply (10/24/12/30 teeth give 6).
    A planetary gear system has a sun gear, planet gears, an internal gear and
    a carrier; sharing the load among several planets makes it compact. With
    the sun as input, the carrier as output and the internal gear fixed, the
    ratio is z_internal / z_sun + 1.
  sources:
    - title: "The ABC's of Gears, basic guide B (KHK Kohara Gear)"
      url: https://khkgears.us/media/fqrlut1m/abcs-of-gearing-b.pdf
  checked: web (the PDF), 2026-11-15

- id: nabtesco-cycloidal
  claim: >-
    In a cycloidal (RV) gearbox, a spur stage turns eccentric shafts that
    drive two cam discs, 180° apart, inside a housing lined with rollers; each
    disc has one cam fewer than there are rollers, and almost half its cams
    are in contact at once. The two stages give ratios from about 30:1 to
    over 300:1, and the maker states the gearbox absorbs up to five times its
    rated torque in an emergency stop.
  sources:
    - title: "Functional principle of cycloidal gears (Nabtesco Precision Europe, FAQ)"
      url: https://www.nabtesco.de/en/service/faq/technologies/functional-principle-of-cycloidal-gears
  checked: web, 2026-11-15

- id: thk-ball-screw
  claim: >-
    In a ball screw, balls roll between the screw shaft and the nut; its
    efficiency is over 90% both turning rotation into linear motion and the
    reverse, and it needs a third or less of the drive torque of a sliding
    screw. A preload can take the axial clearance below zero.
  sources:
    - title: "Ball screw (THK)"
      url: https://www.thk.com/jp/en/products/ball_screw/
    - title: "Ball screw efficiency (THK FAQ)"
      url: https://www.thk.com/eu/en/products/faq/ball_screw/-/0089/modal.html
  checked: web, 2026-11-15
