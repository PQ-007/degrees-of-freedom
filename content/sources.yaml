- id: newton-laws
  claim: >-
    Newton's first law: a body at rest remains at rest, or if in motion remains
    in motion at constant velocity, unless acted on by a net external force;
    inertia is an object's resistance to changes in its motion, measured by
    its mass. Second law: the net force equals mass times acceleration,
    F = ma. Third law: when one body exerts a force on a second, it feels a
    force equal in magnitude and opposite in direction; the two act on
    different bodies (walking pushes the floor backward; rockets move forward
    by expelling gas backward).
  sources:
    - title: "University Physics Volume 1, section 5.2: Newton's First Law (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/5-2-newtons-first-law
    - title: "University Physics Volume 1, section 5.3: Newton's Second Law (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/5-3-newtons-second-law
    - title: "University Physics Volume 1, section 5.5: Newton's Third Law (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/5-5-newtons-third-law
  checked: web, 2026-11-15

- id: torque-def
  claim: >-
    Torque is the cross product of the position vector and the force,
    magnitude rF sin θ; the lever arm is the perpendicular distance from the
    axis to the line of the force; the SI unit is the newton-metre (N·m); if
    the angle is zero, the torque is zero.
  sources:
    - title: "University Physics Volume 1, section 10.6: Torque (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/10-6-torque
  checked: web, 2026-11-15

- id: friction-coef
  claim: >-
    Static friction can be up to μs times the normal force (fs ≤ μs N);
    kinetic friction is μk times the normal force (fk = μk N); the
    coefficients of kinetic friction are less than their static counterparts.
  sources:
    - title: "University Physics Volume 1, section 6.2: Friction (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/6-2-friction
  checked: web, 2026-11-15

- id: power-def
  claim: >-
    Power is the rate of doing work, P = dW/dt, measured in watts
    (1 W = 1 J/s); for a force on a moving body P = F·v, and for rotation
    P = τω.
  sources:
    - title: "University Physics Volume 1, section 7.4: Power (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/7-4-power
    - title: "University Physics Volume 1, section 10.8: Work and Power for Rotational Motion (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-1/pages/10-8-work-and-power-for-rotational-motion
  checked: web, 2026-11-15

- id: standard-gravity
  claim: >-
    The standard acceleration of gravity, g_n, is 9.806 65 m/s², an exact
    value.
  sources:
    - title: "CODATA value: standard acceleration of gravity (NIST)"
      url: https://physics.nist.gov/cgi-bin/cuu/Value?gn
  checked: web, 2026-11-15

- id: current-def
  claim: >-
    Electrical current is the rate at which charge flows, I = dQ/dt; one
    ampere is one coulomb of charge passing per second.
  sources:
    - title: "University Physics Volume 2, section 9.1: Electrical Current (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/9-1-electrical-current
  checked: web, 2026-11-15

- id: magnetic-force-wire
  claim: >-
    A straight wire carrying current I in a uniform magnetic field B feels a
    force F = I l × B, of magnitude I l B sin θ, its direction given by a
    right-hand rule.
  sources:
    - title: "University Physics Volume 2, section 11.4: Magnetic Force on a Current-Carrying Conductor (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/11-4-magnetic-force-on-a-current-carrying-conductor
  checked: web, 2026-11-15

- id: current-loop-motor
  claim: >-
    A current loop in a magnetic field feels a torque of magnitude
    N I A B sin θ; motors are the most common application of magnetic force on
    current-carrying wires: the torque turns a shaft, and reversing the
    current at set points keeps it turning one way, converting electrical
    energy into mechanical work.
  sources:
    - title: "University Physics Volume 2, section 11.5: Force and Torque on a Current Loop (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/11-5-force-and-torque-on-a-current-loop
  checked: web, 2026-11-15

- id: faraday-law
  claim: >-
    Faraday's law: the emf induced in a coil of N turns is ε = −N dΦ/dt, where
    the magnetic flux Φ measures the field through the coil's area; the
    faster the flux changes, the greater the emf. An emf is induced when a bar
    magnet is pushed into or out of a coil.
  sources:
    - title: "University Physics Volume 2, section 13.1: Faraday's Law (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law
  checked: web, 2026-11-15

- id: lenz-law
  claim: >-
    Lenz's law: the induced emf drives a current that always opposes the
    change in magnetic flux.
  sources:
    - title: "University Physics Volume 2, section 13.2: Lenz's Law (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/13-2-lenzs-law
  checked: web, 2026-11-15

- id: back-emf
  claim: >-
    A running motor generates its own emf, the back emf, which opposes the
    emf driving it; it is zero when the motor is not turning and grows in
    proportion to its angular velocity, so the motor draws its maximum current
    when it is on but not turning; under a load it slows, the back emf drops
    and more current flows, and too low a speed can overheat it.
  sources:
    - title: "University Physics Volume 2, section 13.6: Electric Generators and Back Emf (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/13-6-electric-generators-and-back-emf
  checked: web, 2026-11-15

- id: hall-effect
  claim: >-
    In the Hall effect, a magnetic field deflects the moving charges in a
    current-carrying strip, producing a voltage across it; the Hall effect can
    be used to measure magnetic fields.
  sources:
    - title: "University Physics Volume 2, section 11.6: The Hall Effect (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/11-6-the-hall-effect
  checked: web, 2026-11-15

- id: ohms-law
  claim: >-
    Ohm's law: V = IR, with the resistance the voltage divided by the current;
    components that do not follow it, such as the diode, are nonohmic.
  sources:
    - title: "University Physics Volume 2, section 9.4: Ohm's Law (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/9-4-ohms-law
  checked: web, 2026-11-15

- id: electric-power
  claim: >-
    The electric power gained or lost by a device is P = IV; for a resistor
    P = I²R = V²/R, and the energy is dissipated as heat.
  sources:
    - title: "University Physics Volume 2, section 9.5: Electrical Energy and Power (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/9-5-electrical-energy-and-power
  checked: web, 2026-11-15

- id: capacitor-def
  claim: >-
    A capacitor stores electrical charge and energy in two conductors separated
    by a distance; its capacitance is C = Q/V, measured in farads.
  sources:
    - title: "University Physics Volume 2, section 8.1: Capacitors and Capacitance (OpenStax)"
      url: https://openstax.org/books/university-physics-volume-2/pages/8-1-capacitors-and-capacitance
  checked: web, 2026-11-15

- id: sparkfun-diodes
  claim: >-
    Current through a diode can only go one way, the forward direction; a
    silicon diode's forward voltage is around 0.6-1 V and an LED's usually
    larger (1.2-3 V); flyback diodes protect against the voltage spikes an
    inductive component such as a motor makes.
  sources:
    - title: "Diodes (SparkFun)"
      url: https://learn.sparkfun.com/tutorials/diodes/all
  checked: web, 2026-11-15

- id: sparkfun-transistors
  claim: >-
    A transistor can be used as a switch or an amplifier: a small current or
    voltage at its control pin controls a larger current through it; an
    H-bridge of transistors can drive a motor both clockwise and
    counter-clockwise.
  sources:
    - title: "Transistors (SparkFun)"
      url: https://learn.sparkfun.com/tutorials/transistors/all
  checked: web, 2026-11-15

- id: arduino-pwm
  claim: >-
    Pulse width modulation switches a signal on and off in a square wave;
    changing the share of time it is on simulates voltages between the
    supply and 0 V. Arduino's PWM runs at about 500 Hz, and analogWrite(127)
    is a 50% duty cycle (on half the time). Repeated fast enough with an LED,
    it is as if the voltage were steady.
  sources:
    - title: "Basics of PWM (Pulse Width Modulation) (Arduino documentation)"
      url: https://docs.arduino.cc/learn/microcontrollers/analog-output/
  checked: web (the page's source text on GitHub), 2026-11-15

- id: sparkfun-capacitors
  claim: >-
    Decoupling capacitors suppress high-frequency noise in power supplies:
    they take tiny voltage ripples out of a chip's supply and can briefly
    supply power at the correct voltage when it sags; they should sit as close
    as possible to the chip.
  sources:
    - title: "Capacitors (SparkFun)"
      url: https://learn.sparkfun.com/tutorials/capacitors/all
  checked: web, 2026-11-15

- id: sparkfun-leds
  claim: >-
    An LED connected directly to a source tries to draw as much current as it
    can and destroys itself; a resistor limits the current and protects it.
  sources:
    - title: "Light-Emitting Diodes (LEDs) (SparkFun)"
      url: https://learn.sparkfun.com/tutorials/light-emitting-diodes-leds/all
  checked: web, 2026-11-15

- id: arduino-sketch-cpp
  claim: >-
